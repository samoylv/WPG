[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "WPG"
version = "2026.11"
description = "WavePropaGator: interactive framework for X-ray wavefront propagation based on SRW"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Alexey Buzmakov", email = "buzmakov@gmail.com"},
    {name = "Liubov Samoylova"},
]
requires-python = ">=3.10"
# srwpy: official SRW wheels from PyPI, or a local build from sources (see build/build_srw.py)
dependencies = [
    "srwpy>=4.2",
    "numpy",
    "scipy",
    "h5py>=3",
    "matplotlib",
]

[project.optional-dependencies]
# wpg.source (SASE pulses) uses phenom
source = ["phenom-xfel"]
# wpg.materials (optical constants, mirror reflectivity) uses xraylib
materials = ["xraylib"]
test = ["pytest", "nbformat", "nbconvert", "ipykernel"]
docs = ["sphinx", "sphinx-rtd-theme"]
dev = ["WPG[test,docs,materials]", "ruff"]

[project.urls]
Homepage = "https://github.com/samoylv/WPG"
Documentation = "https://samoylv.github.io/WPG/"

[project.scripts]
# diagnostics for bug reports, also: python -m wpg_diagnose
wpg-diagnose = "wpg_diagnose:main"

[tool.setuptools]
# outside the wpg package so that it runs when "import wpg" fails
py-modules = ["wpg_diagnose"]

[tool.setuptools.packages.find]
include = ["wpg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["notebooks: execute sample notebooks (slow), run with -m notebooks"]
addopts = "-v -m 'not notebooks'"

[tool.ruff]
target-version = "py310"
extend-exclude = ["samples", "docs", "beamlines", "unittest_", "updates", "Docker", "s2e/prop/notebook_for_dev"]

[tool.ruff.lint]
# Bug classes only, no style rules (keeps the diff with colleagues' branches small):
# F: pyflakes (undefined names, ...), E9: syntax errors, W605: invalid escape sequences,
# NPY201: NumPy 2 incompatibilities
select = ["F", "E9", "W605", "NPY201"]
# unused imports and variables in old code are harmless
ignore = ["F401", "F841"]
